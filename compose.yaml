services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            evolution-api:
                condition: service_started
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-agendaflow}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD:-password}']
            retries: 5
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            retries: 5
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    evolution-api:
        image: 'evoapicloud/evolution-api:v2.3.7'
        restart: unless-stopped
        ports:
            - '${EVOLUTION_FORWARD_PORT:-8080}:8080'
        environment:
            SERVER_URL: '${EVOLUTION_PUBLIC_URL:-http://localhost:8080}'
            AUTHENTICATION_API_KEY: '${EVOLUTION_API_KEY}'
            DATABASE_ENABLED: 'true'
            DATABASE_PROVIDER: 'postgresql'
            DATABASE_CONNECTION_URI: 'postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution?schema=public'
            DATABASE_CONNECTION_CLIENT_NAME: 'evolution_agendaflow'
            DATABASE_SAVE_DATA_INSTANCE: 'true'
            DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
            DATABASE_SAVE_MESSAGE_UPDATE: 'false'
            DATABASE_SAVE_DATA_CONTACTS: 'false'
            DATABASE_SAVE_DATA_CHATS: 'false'
            DATABASE_SAVE_DATA_LABELS: 'false'
            DATABASE_SAVE_DATA_HISTORIC: 'false'
            CACHE_REDIS_ENABLED: 'true'
            CACHE_REDIS_URI: 'redis://redis:6379/1'
            CACHE_REDIS_PREFIX_KEY: 'evolution_agendaflow'
            CACHE_REDIS_SAVE_INSTANCES: 'true'
            CACHE_LOCAL_ENABLED: 'false'
        volumes:
            - 'evolution-instances:/evolution/instances'
        networks:
            - sail
        depends_on:
            evolution-postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
    evolution-postgres:
        image: 'postgres:15-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_USER: evolution
            POSTGRES_PASSWORD: '${EVOLUTION_DB_PASSWORD}'
            POSTGRES_DB: evolution
        volumes:
            - 'evolution-postgres:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
            retries: 10
            timeout: 5s
    queue:
        image: sail-8.4/app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
            evolution-api:
                condition: service_started
        command: php artisan queue:work --queue=notifications,default --sleep=3 --tries=3 --max-time=3600
    scheduler:
        image: sail-8.4/app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            laravel.test:
                condition: service_started
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: php artisan schedule:work
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    evolution-instances:
        driver: local
    evolution-postgres:
        driver: local
